# Canonical Hanzo CI/CD manifest — read by hanzoai/ci and platform.hanzo.ai.
# One file, one way.
#
# The builder reads `repo:` off each images[] entry. An entry carrying neither
# `repo:` nor `image:` resolves to null and names every tag it builds
# `null:sha-<sha>-amd64`.
#
# Host is ghcr.io: that is where the fleet publishes and where universe's
# deploys read from. hanzoai/ci mirrors each published tag on to
# oci.hanzo.ai/<org>/<name>.
images:
  - name: ledger
    repo: ghcr.io/hanzo-fi/ledger
    dockerfile: build.Dockerfile
    context: .

test:
  - go build ./...
  - go test ./...
